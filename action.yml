name: Stellar Protocol Canary
description: >-
  Run Stellar protocol compatibility checks (XDR, RPC, Soroban) against the
  real Protocol-Canary CLI and report the result as a GitHub job summary,
  annotations, and a downloadable JSON artifact.
author: StellarCanary

branding:
  icon: shield
  color: yellow

inputs:
  protocol:
    description: >-
      Target Stellar protocol version to check compatibility against
      (forwarded as `stellar-canary check --protocol`). Must be a whole
      number from 1 to 4294967295 inclusive (the engine's `--protocol` is a
      u32 and rejects 0). If omitted, the CLI uses the `protocol` field from
      the project's `.stellar-canary.toml`, or 28 if there is no
      configuration file.
    required: false

  config:
    description: >-
      Path to a `.stellar-canary.toml` configuration file, relative to the
      workflow's working directory. If omitted, the CLI looks for
      `.stellar-canary.toml` in the project root. If a path is given and
      the file does not exist, the Action fails before invoking Canary;
      a path that exists but is not a regular file (for example a
      directory) is rejected the same way, rather than being forwarded to
      the CLI to fail later with a less actionable error. A relative path
      is resolved to an absolute path against that working directory
      before being forwarded, so the file that is validated and the file
      the CLI reads are always the same.
    required: false

  working-directory:
    description: >-
      Directory to treat as the project root of the run, forwarded as
      `stellar-canary check --project-root` so a monorepo can check one
      subdirectory or workspace member. Relative paths are resolved against
      the workspace, and a path that does not exist or is not a directory
      (for example a regular file) fails the run before Canary is invoked,
      with the value as written and the resolved path in the error. Defaults
      to `.` — the workspace itself, which is what Canary already uses — and
      that default is validated but not forwarded, so runs that never set
      this input send exactly the arguments they always did. When a value
      *is* given, relative paths such as `--fixtures-dir` are resolved
      against it by the engine, and it requires an engine release that
      supports `--project-root` (Protocol-Canary E-010): older releases such
      as the default `version` reject the unknown argument with a clear
      usage error rather than silently checking the wrong directory.
    required: false
    default: "."

  network:
    description: >-
      Stellar network to run live RPC/Soroban checks against (for example
      `testnet`, `futurenet`, or `mainnet`). Forwarded as `--network`.
      Ignored if the project's configuration disables both RPC and
      Soroban checks.
    required: false

  network-passphrase:
    description: >-
      Expected Stellar network passphrase for RPC identity verification.
      Forwarded as `--network-passphrase` by Protocol-Canary 0.3.0 and newer.
      An explicit passphrase overrides the well-known passphrase for `network`;
      use it for private networks or intentional endpoint overrides. Must not
      be empty or contain control characters.
    required: false
    default: "\u0001"

  rpc-max-retries:
    description: >-
      Maximum retries after a failed RPC attempt (`--rpc-max-retries`), from
      0 to 4294967295. Zero disables retries. Forwarded by Protocol-Canary
      0.3.0 and newer; otherwise the engine default applies.
    required: false

  rpc-retry-delay-ms:
    description: >-
      Base delay in milliseconds between RPC retries (`--rpc-retry-delay-ms`),
      from 0 to 9007199254740991. The engine uses linear backoff. Forwarded by
      Protocol-Canary 0.3.0 and newer; otherwise the engine default applies.
    required: false

  rpc-url:
    description: >-
      Stellar RPC endpoint to use for live checks. Forwarded as
      `--rpc-url`. Required by the CLI for networks without a built-in
      default endpoint. Must be an `https://` URL (plain `http://` is
      only accepted for `localhost`/`127.0.0.1`).
    required: false

  fixtures-dir:
    description: >-
      Path to the directory of compatibility fixtures (for example a
      checkout of `StellarCanary/ProtocolCanary-Fixtures`), forwarded as
      `--fixtures-dir`. Defaults to `fixtures` relative to the working
      directory, matching the CLI's own default.
    required: false
    default: fixtures

  fixture:
    description: >-
      Run only the fixture with this exact id, forwarded as the single
      argument `--fixture=<id>` — the usual way to reproduce one failing
      check in CI. Empty or whitespace-only means unset. Must not contain
      control characters (C0, DEL, C1); no other characters are restricted,
      because the engine decides what a fixture id is, and the
      `--flag=value` form means an id beginning with `-` is still passed
      safely. Requires a Protocol-Canary release whose `check` accepts
      `--fixture`: with an older resolved `version` (or while no release
      supports it) the Action fails before installing or running anything,
      naming this input, the resolved version, and the minimum supporting
      release — it never silently runs the whole suite instead.
    required: false

  surface:
    description: >-
      Run only fixtures of this surface, forwarded as the single argument
      `--surface=<surface>`. Must be exactly one of `xdr`, `rpc`, or
      `soroban` (lower case, as the engine accepts); anything else fails
      the run with an input error naming the accepted values. Empty or
      whitespace-only means unset. Same engine requirement as `fixture`:
      with an unsupported resolved `version` the Action fails before
      installing or running anything rather than checking every surface.
    required: false

  cache-dir:
    description: >-
      Directory for cached fixture results, forwarded as the single
      argument `--cache-dir=<path>` and passed to the engine unchanged.
      The engine — not the Action — resolves a relative path against
      `--project-root` when one is given, so the path is deliberately not
      resolved against `GITHUB_WORKSPACE` or the working directory. Missing
      directories are created by the engine; a path that is an existing
      file is rejected by the engine. May be combined with the engine's
      cache-disabling flag (the engine accepts both). Empty or
      whitespace-only means unset; control characters are rejected. Same
      engine requirement as `fixture`: an unsupported resolved `version`
      fails the run before installing or running anything rather than
      caching results somewhere the caller did not ask for.
    required: false

  version:
    description: >-
      Protocol Canary version to install and run, without a leading `v`
      (for example `0.1.1`). This must match a real release tag on
      `StellarCanary/Protocol-Canary`. Reproducibility matters: this
      Action never tracks `main` or an unpinned "latest" build.
    required: false
    default: 0.2.0

  upload-report:
    description: >-
      Upload the machine-readable JSON report as a workflow artifact
      named `stellar-protocol-canary-report`. Defaults to `true`; set to
      `false` to skip the artifact upload entirely. When the same
      workflow run invokes this Action more than once (for example a
      matrix over networks or protocol versions), the first invocation
      keeps that stable name and later invocations automatically retry
      under a name suffixed with the inputs that distinguish them.
      Artifact upload is auxiliary: a failure to upload never changes
      the underlying compatibility result.
    required: false
    default: "true"

  report-retention-days:
    description: >-
      Duration in days (integer from 1 to 90) to retain the uploaded JSON
      report artifact. If omitted, GitHub's default retention for the
      repository is used.
    required: false

  annotations:
    description: >-
      Convert compatibility failures, warnings, and execution errors into
      GitHub Actions annotations. Defaults to `true`; set it to `false` to
      report through the job summary, outputs, and JSON artifact only.
    required: false
    default: "true"

  diagnostics:
    description: >-
      Opt in to a best-effort redacted diagnostics log bundle when Canary
      cannot produce a usable report (for example an install failure, timeout,
      or unparseable output). Defaults to `false`: diagnostics artifacts are
      strictly opt-in because they are downloadable by anyone who can read the
      repository and their redaction is best effort. The process environment
      is never included in the bundle.
    required: false
    default: "false"

  timeout-minutes:
    description: >-
      Maximum time to let the Canary process run before it is terminated
      and the Action fails with a timeout error. Also bounds the
      `cargo install` step (floored at one minute, so a very small value
      set purely for the check cannot break installation); see the README's
      Timeouts section. Must be a whole number of minutes from 1 to 35791:
      the value is multiplied by 60,000 and passed to Node's `setTimeout`,
      which clamps any delay above 2,147,483,647 ms (about 35,791 minutes)
      and would fire the timer after 1 ms, ending the run almost
      immediately, so larger values are rejected up front. It is unrelated
      to GitHub Actions' own job/step-level `timeout-minutes`, which the
      platform enforces over the whole job: set any surrounding job- or
      step-level `timeout-minutes` comfortably higher than this value,
      otherwise GitHub's own timeout can terminate the step first with a
      generic error and no Canary summary, annotations, or timeout
      diagnostic.
    required: false
    default: "15"

  allow-empty:
    description: >-
      Let a run that executes no checks pass. Protocol Canary 0.2.0 and newer
      fail such a run (exit code 2: no fixture directory, no fixture files, or
      every fixture skipped for the target protocol); set this to `true` only
      when an empty run is intended. Forwarded as `--allow-empty` when the
      resolved `version` is 0.2.0 or newer. With an older version it has no
      effect, because those versions already pass an empty run and reject the
      flag. Defaults to `false`.
    required: false
    default: "false"

  rpc-timeout-seconds:
    description: >-
      Request timeout for the engine's RPC client, in seconds (forwarded as
      `stellar-canary check --rpc-timeout`). Requires Protocol Canary 0.2.0
      or newer; with an older `version` the flag is not forwarded and the
      Action logs a note naming this input. Must be a positive integer
      between 1 and 600. Omitted, the engine uses its own default (10
      seconds).
    required: false

  max-concurrency:
    description: >-
      Maximum number of concurrent live RPC/Soroban requests (forwarded as
      `stellar-canary check --max-concurrency`). Requires Protocol Canary
      0.2.0 or newer; with an older `version` the flag is not forwarded and
      the Action logs a note naming this input. Must be a positive integer
      between 1 and 64. Omitted, the engine uses its own default (4).
    required: false

  no-cache:
    description: >-
      Set to `true` to disable the engine's local result cache, so every
      fixture runs fresh (forwarded as `stellar-canary check --no-cache`).
      Requires Protocol Canary 0.2.0 or newer; with an older `version` the
      flag is not forwarded and the Action logs a note naming this input.
      Conflicts with `live-cache-ttl-seconds`: the engine declares the two
      flags incompatible, so `no-cache: true` together with a
      `live-cache-ttl-seconds` value is rejected during input validation,
      before Canary runs. `no-cache: false` (or omitting it) with a TTL is
      accepted. Omitted, the engine's default applies (cache enabled).
    required: false

  live-cache-ttl-seconds:
    description: >-
      How long, in seconds, RPC and Soroban results from the local cache may
      be replayed (forwarded as `stellar-canary check --live-cache-ttl`).
      Requires Protocol Canary 0.2.0 or newer; with an older `version` the
      flag is not forwarded and the Action logs a note naming this input.
      Must be a positive integer between 1 and 604800 (7 days). Cannot be
      combined with `no-cache: true` (see `no-cache`). Omitted, the engine's
      default applies (cached live results are not replayed).
    required: false

  fail-on-warning:
    description: >-
      Fail the check when Protocol Canary reports warnings. This input is
      ignored with a warning until Protocol-Canary releases a version that
      supports `--fail-on-warning`; it defaults to `false`.
    required: false
    default: "false"

  offline:
    description: >-
      Run without network fixtures. This input is ignored with a warning
      until Protocol-Canary releases a version that supports `--offline`;
      it defaults to `false`.
    required: false
    default: "false"

  fixtures-pack-version:
    description: >-
      Release tag of the fixture pack to run against, for example `v1.2.0`
      (the leading `v` is optional). Validated for format when set, and an
      unpinned value such as `latest` or `main` is rejected outright, the
      same way `version` refuses to track a moving reference.
      Currently *not forwarded* to Canary: `stellar-canary check` has no
      fixture-pack flag — its fixture-loading contract accepts a local path
      via `fixtures-dir` and defines no other loading mechanism — so pinning a
      pack still means checking out that pack's tag into `fixtures-dir`.
      The Action logs a note when this input is set.
    required: false

  fixtures-pack-protocol:
    description: >-
      Protocol version the fixture pack is pinned to, as a positive integer,
      for example `28`. Zero is rejected, as is anything above 4294967295;
      `protocol` accepts the same 1-to-4294967295 range.
      Currently *not forwarded* to Canary, for the same reason as
      `fixtures-pack-version`; the Action logs a note when it is set. The
      protocol a run actually checks is controlled by `protocol`.
    required: false

  baseline-report:
    description: >-
      Path to a previous Protocol Canary JSON report to validate against, for
      example a report uploaded from the base branch of a pull request. The
      file must exist and be a complete schemaVersion 1 report recorded for
      the same target protocol as this run. The engine's `diff` command is not
      released yet (#335), so the Action validates the baseline and fails
      clearly on a missing, malformed, or protocol-incompatible file, but it
      does not produce a regression verdict. Empty by default.
    required: false

  github-token:
    description: >-
      GitHub token used to authenticate read-only GitHub REST API requests
      to the public `StellarCanary/Protocol-Canary` repository (tag and release
      lookups). If set to a non-empty value,
      it takes precedence over the `GITHUB_TOKEN` environment variable. If empty
      or unset, the `GITHUB_TOKEN` environment variable is used if present;
      otherwise unauthenticated requests are made. Requires only `contents: read`
      permission, which works even in fork pull requests. Set to an empty string
      (`""`) to disable authentication when `GITHUB_TOKEN` is also unset.
    required: false
  strict-integrity:
    description: >-
      Optional fail-closed integrity policy (issue #372). Defaults to `false`,
      preserving today's behaviour: when the published SHA-256 checksum for
      the resolved release is missing or does not cover this platform, the
      Action degrades to commit/tag pinning with a debug note. Set to `true`
      to abort instead whenever binary integrity cannot be proven - no
      published checksum manifest, no manifest entry for this platform, or a
      checksum lookup that could not be completed (for example a redirected
      or unencrypted manifest request). A checksum mismatch aborts the run in
      either mode. Be honest about what "proven" means (decision D-07): a
      checksum verifies data integrity, not the release author's identity or
      endorsement, and release signing is deferred; the download-redirect
      allowlist policy (D-11) remains blocked until verified against real
      release hosts, so no redirect is followed at all today.
    required: false
    default: "false"

  pr-comment:
    description: >-
      Opt in to a bounded pull request summary comment. Requires pull-requests: write
      on same-repository pull_request workflows. Fork PRs and other events are skipped.
      Permission failures are warnings, not failed checks. Defaults to false.
    required: false
    default: "false"

  junit-report:
    description: >-
      Render the parsed JSON report to JUnit XML using the engine's own
      command (`stellar-canary report <report.json> --format junit`) and
      expose the file as the `junit-report-path` output. Written next to the
      JSON report (same directory), and included in the workflow artifact
      when `upload-report` is `true`. Requires a Protocol-Canary release
      whose `report` command supports `--format junit` (Protocol-Canary
      #434; not in 0.2.0): with an older engine nothing is produced and a
      warning is logged. Any failure of this step — unsupported engine,
      non-zero exit, empty output, missing report file — is a warning only:
      it never changes `status` and never fails the job. Defaults to `false`,
      so the default behaviour is unchanged.
    required: false
    default: "false"

  generate-receipt:
    description: >-
      Generate a machine-readable Execution Receipt (`receiptVersion: 1`)
      recording the provenance of this run — engine version, engine build
      commit, fixture-pack digest, target protocol, observed protocol, and
      timestamp — write it to the runner temp directory, and upload it as
      the workflow artifact `stellar-canary-receipt-<run-id>`. Defaults to
      `false`; set to `true` to opt in. The receipt is a lightweight
      provenance record, not a signed cryptographic attestation. Fields the
      engine's report does not carry (for example older releases without
      `engineCommit`/`packDigest`) are recorded as `unknown`.
    required: false
    default: "false"

outputs:
  status:
    description: >-
      Overall result reported by Canary: `pass`, `warning`, `fail`,
      `error`, or `execution-failed` (set by the Action itself when
      Canary could not produce a report at all).
  passed:
    description: Number of checks that passed.
  warnings:
    description: Number of checks that produced a warning.
  failures:
    description: Number of checks that failed a compatibility assertion.
  errors:
    description: Number of checks that could not complete due to an execution error.
  total:
    description: >-
      Total number of checks in the report counts. Explicitly set to `0` on
      an execution failure, like the other counts.
  skipped:
    description: >-
      Number of checks skipped. Explicitly set to `0` on an execution failure,
      like the other counts.
  replayed-count:
    description: >-
      Number of checks whose results were replayed from Protocol Canary's
      result cache instead of executed in this run (a result with
      `source: "cache"`, or an equivalent replayed/cached flag). Counts
      results carrying any replayed marker; engines whose reports predate
      the cache produce `0`. Explicitly set to `0` on an execution failure,
      like the other counts.
  engine-version:
    description: >-
      Protocol Canary engine version that produced the result, read from the
      installed binary. On an execution failure, set to the resolved version if
      installation succeeded, or an empty string if installation failed.
  observed-protocol:
    description: >-
      Stellar protocol version reported by the network during live checks
      (`network.observedProtocol`), or an empty string when the report has no
      network object. Explicitly set to an empty string on an execution failure.
  pack-protocol:
    description: >-
      Protocol version of the resolved fixture pack, as an integer string,
      when a pack identity is recorded in the report or pinned with the
      `fixtures-pack-protocol` input. Empty when no external fixture pack is
      in use or the identity is not recorded.
  pack-version:
    description: >-
      Release tag/version of the resolved fixture pack, when recorded in the
      report or pinned with the `fixtures-pack-version` input. Empty when no
      external fixture pack is in use or the identity is not recorded.
  pack-digest:
    description: >-
      Canonical content digest of the resolved fixture pack, formatted as
      `sha256:<64 lowercase hex>`, when the report records one. Empty when no
      external fixture pack is in use, the digest is not recorded, or the
      recorded value is malformed; the Action never fabricates a digest.
  report:
    description: >-
      Absolute path to the generated JSON report file. Only set when Canary
      produced output to parse; empty/unset on an execution failure (when
      status is `execution-failed`), unlike `passed`/`warnings`/`failures`/`errors`,
      which are explicitly set to `0` in that case.
  coverage-state:
    description: >-
      How completely the fixture set was exercised: `full` when every
      discovered fixture ran and nothing was skipped, `partial` when at
      least one fixture ran but others were skipped, and `none` when no
      fixture ran at all (an empty run, or an execution failure). Set on
      every path, including an execution failure, where it is always
      `none`. Intended for a downstream job that gates a promotion on
      coverage rather than on `status` alone; `none` is the conservative
      default for a run that cannot prove it executed the fixtures.
  receipt-path:
    description: >-
      Absolute path to the generated Execution Receipt JSON. Only set when
      `generate-receipt` is `true` and Canary produced a parseable report;
      unset otherwise, including on an execution failure.
  junit-report-path:
    description: >-
      Absolute path to the generated JUnit XML file. Only set when
      `junit-report` is `true` and the engine's `report --format junit`
      command succeeded; unset otherwise (input disabled, engine without
      the command, or a failed/empty render) and on an execution failure.
      A failed render is always a warning, never a status change.
  artifact-name:
    description: >-
      Name of the uploaded report artifact. Empty if upload was disabled
      or failed, or on an execution failure. Reflects the fallback name
      if a name collision occurred.
  artifact-id:
    description: >-
      GitHub artifact ID of the uploaded report artifact. Empty if upload
      was disabled or failed, if the client did not return an ID, or on
      an execution failure.

runs:
  using: node24
  main: dist/index.js
