name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to smoke test (e.g. v0.1.1). When specified, skips publishing and only runs the smoke test.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: verify and publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] release job must push floating major tag with repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] release workflow runs only on trusted maintainer pushed tags
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Verify release tag matches package.json and CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed dist/ matches a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ does not match a fresh build for this tag. Rebuild and re-tag."
            exit 1
          fi

      # #457, option "stamp the release": make a caller's pin of THIS
      # workflow actually select this release's Action code. The Action
      # reference inside reusable-canary-check.yml is fixed text (a `uses:`
      # value cannot contain expressions), so on main it reads `@v1` — the
      # stamp template. For each release tag this step creates a stamped
      # commit whose workflow refers to the Action at this release's own
      # commit SHA (literal 40-hex), then moves the release tag to that
      # stamped commit; the existing "Move floating major tag" step below
      # then resolves the (moved) release tag and points v1 at the same
      # commit. A caller who pins the workflow to this tag or to the
      # stamped commit therefore runs `uses: ...@<release commit>`: no
      # skew between the pinned workflow file and the Action that executes.
      - name: Stamp the reusable workflow with this release's commit (#457)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflow=".github/workflows/reusable-canary-check.yml"

          # Idempotency: force-moving the release tag re-triggers this
          # workflow at the stamped commit. That run must not stamp again,
          # or the tag would move forever.
          if grep -q "# release-stamp: ${RELEASE_TAG}" "$workflow"; then
            echo "::notice::${workflow} is already stamped for ${RELEASE_TAG}; nothing to do."
            exit 0
          fi

          # Literal SHA only — this is the whole point: a ref a caller's
          # pin can trust. The pattern accepts the `@v1` template and any
          # previously stamped SHA, so a re-stamp from either state works.
          sed -i -E \
            "s|(uses:[[:space:]]+StellarCanary/ProtocolCanary-Action@)(v[0-9]+|[0-9a-f]{40})|\1${RELEASE_COMMIT} # release-stamp: ${RELEASE_TAG}|" \
            "$workflow"

          if ! grep -qF "uses: StellarCanary/ProtocolCanary-Action@${RELEASE_COMMIT} # release-stamp: ${RELEASE_TAG}" "$workflow"; then
            echo "::error::Stamping failed: ${workflow} does not reference the release commit ${RELEASE_COMMIT}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$workflow"
          git commit -m "Stamp ${RELEASE_TAG}: reusable workflow uses Action ${RELEASE_COMMIT}"
          stamped="$(git rev-parse HEAD)"

          git tag -fa "$RELEASE_TAG" -m "Release ${RELEASE_TAG} (stamped to ${RELEASE_COMMIT})"
          git push origin "refs/tags/${RELEASE_TAG}" --force
          echo "::notice::Stamped ${RELEASE_TAG}: its reusable workflow now uses Action@${RELEASE_COMMIT}; tag moved to ${stamped}."

      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] action-gh-release handles asset uploads and automatic release notes cleanly
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true

      # Keep the floating major tag (v1) pointing at the latest release in
      # that major line. This used to be a manual step maintainers had to
      # remember (see CONTRIBUTING.md); forgetting it silently left every
      # `@v1` consumer on a stale release.
      - name: Move floating major tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The push event only fetches the pushed tag; the rest are needed
          # to decide whether this release is the newest in its major line.
          git fetch --tags --force

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$RELEASE_TAG is not a vX.Y.Z tag; not moving a major tag."
            exit 0
          fi

          major="v${BASH_REMATCH[1]}"
          if [[ "$major" == "v0" ]]; then
            echo "::notice::Pre-1.0 releases do not publish a floating major tag; skipping."
            exit 0
          fi

          # Never move the major tag backwards: if a newer release in this
          # major line already exists (a re-run, or a tag pushed out of
          # order), leave the tag where it is.
          latest="$(git tag --list "${major}.*" --sort=-v:refname | head -n1)"
          if [[ "$latest" != "$RELEASE_TAG" ]]; then
            echo "::notice::$RELEASE_TAG is not the latest ${major} release (${latest} is); leaving ${major} untouched."
            exit 0
          fi

          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git tag -fa "$major" "$commit" -m "Update ${major} to ${RELEASE_TAG}"
          git push origin "refs/tags/${major}" --force
          echo "::notice::Moved ${major} to ${RELEASE_TAG} (${commit})."

  smoke-test:
    name: smoke test
    needs: [release]
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag specified to smoke test"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout fixture project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout published Action release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: StellarCanary/ProtocolCanary-Action
          ref: ${{ steps.resolve-tag.outputs.tag }}
          path: .published-action
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] smoke-test runs standalone node runtime without caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Run published Action
        id: canary
        uses: ./.published-action # zizmor: ignore[self-repository] invokes published release tag checked out at runtime
        with:
          config: tests/fixtures/real-engine/offline.stellar-canary.toml
          fixtures-dir: tests/fixtures/real-engine/fixtures
          version: "0.1.1"
          protocol: 28
          allow-empty: "false"

      - name: Verify smoke test outputs
        shell: bash
        env:
          STATUS: ${{ steps.canary.outputs.status }}
          PASSED: ${{ steps.canary.outputs.passed }}
          REPORT: ${{ steps.canary.outputs.report }}
        run: |
          set -euo pipefail

          echo "Status: $STATUS"
          echo "Passed count: $PASSED"
          echo "Report path: $REPORT"

          if [ "$STATUS" != "pass" ]; then
            echo "::error::Expected status 'pass', got '$STATUS'"
            exit 1
          fi

          if [ -z "$PASSED" ] || [ "$PASSED" -le 0 ]; then
            echo "::error::Expected passed count > 0, got '$PASSED'"
            exit 1
          fi

          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::error::Report file missing or not found at '$REPORT'"
            exit 1
          fi

          echo "Smoke test of published release tag passed successfully."
